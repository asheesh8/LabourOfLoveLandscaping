<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Labour of Love Landscaping</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/photos/LabourOfLoveicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<div class="adm">
  <aside class="adm__side">
    <div class="adm__brand">Labour of Love</div>
    <div class="adm__sub">Nursery admin</div>
    <nav class="adm__nav" id="nav" aria-label="Admin sections"></nav>
    <footer>
      Storage: <b id="driverName">—</b><br>
      <a href="index.html" target="_blank" rel="noopener">View the site ↗</a>
    </footer>
  </aside>

  <main class="adm__main">
    <div class="adm__head">
      <div>
        <h1 id="viewTitle">Overview</h1>
        <p class="adm__hint" id="viewHint"></p>
      </div>
      <div id="viewActions" style="display:flex;gap:.5rem;flex-wrap:wrap"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim" data-open="false"></div>
<aside class="drawer" id="drawer" data-open="false" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer__head">
    <h2 id="drawerTitle">Edit</h2>
    <button class="iconbtn" id="drawerClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6l-12 12"/></svg>
    </button>
  </div>
  <form class="drawer__body" id="drawerBody"></form>
  <div class="drawer__foot">
    <button class="btn btn--sm" id="drawerCancel" type="button">Cancel</button>
    <button class="btn btn--sm btn--fill" id="drawerSave" type="button">Save</button>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
